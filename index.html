<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Numora · Money, worked out</title>
  <meta name="description" content="Loan, mortgage, credit card, debt, SIP, savings, deposit, retirement and inflation calculators for 26 countries in 12 languages, with Numi, a private money assistant.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050507">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Numora","applicationCategory":"FinanceApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0"}}</script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><div class="grid"></div></div>

  <div class="boot" id="boot" aria-hidden="true"><span class="mark"></span><span class="bar"><i></i></span></div>

  <header class="top">
    <a class="brand tap" href="#"><span class="mark"></span><b>Numora</b></a>
    <span class="tagline" id="tagline"></span>
    <span class="sp"></span>
    <button class="loc tap" id="loc"><span id="loc-flag"></span><span id="loc-txt"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="ib tap" id="saved-btn"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    <button class="ib tap" id="theme-btn"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <div class="pop" id="pop" hidden></div>
  </header>

  <div class="app">
    <nav class="rail" id="rail" aria-label="Calculators"></nav>
    <main class="stage" id="stage">
      <section class="panel inputs" id="inputs">
        <div class="p-head"><span class="p-ic" id="p-ic"></span><h1 id="title"></h1></div>
        <form id="form" novalidate></form>
      </section>
      <section class="panel result" id="result" aria-live="polite">
        <div class="hero">
          <small id="h-label"></small>
          <div class="big" id="h-value">—</div>
          <span class="sub" id="h-sub"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="chart" id="chart"></div>
        <div class="legend" id="legend"></div>
        <p class="answer" id="answer"></p>
        <div class="ins" id="insights"></div>
        <div class="actions">
          <button class="act tap" id="btn-save"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span></span></button>
          <button class="act tap" id="btn-share"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg><span></span></button>
          <button class="act pri tap" id="btn-ask"><span class="orb xs"><i></i></span><span></span></button>
        </div>
        <p class="disc" id="disc"></p>
      </section>
    </main>
  </div>

  <button class="mbar tap" id="mbar"><small id="mbar-l"></small><b id="mbar-v"></b></button>
  <div class="drawer" id="drawer" hidden></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
