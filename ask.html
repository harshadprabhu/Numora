<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060a14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <title>Ask Numi — your money assistant | Numora</title>
  <meta name="description" content="Ask money questions in plain words: loan payments, mortgage payoff, SIP, savings goals, retirement and more. Numi answers instantly, privately, on your device.">
</head>
<body>
  <main class="wrap" style="padding-top:18px">
    <div id="chat"></div>
  </main>
  <script type="module">
    import { mountShell } from './assets/shell.js';
    import { mountChat } from './assets/numi.js';
    mountShell('ask');
    const chat = mountChat(document.getElementById('chat'));
    const q = new URLSearchParams(location.search).get('q');
    if (q) chat.ask(q);
  </script>
</body>
</html>
